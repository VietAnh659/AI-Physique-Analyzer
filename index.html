<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Physique Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0A0C0E; --panel:#14171A; --panel2:#1B1F23; --border:#262B2F;
    --text:#ECEEEC; --dim:#8A9299; --dim2:#4A5157;
    --accent:#46D5C4; --accent2:#8C6FE8; --ghost:#CFE8FF;
    --good:#46D98F; --mid:#E8B84A; --bad:#E8654A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .sg{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:760px;margin:0 auto;padding:18px 16px 70px;min-height:100vh;}
  button{font-family:inherit;}
  .tapbtn{transition:transform .22s cubic-bezier(.2,.75,.25,1), border-color .22s ease, box-shadow .22s ease, filter .22s ease; cursor:pointer;position:relative;}
  .tapbtn:active{transform:scale(0.97);}
  .tapbtn.ui-hover-active{transform:translateY(-2px) scale(1.008);border-color:rgba(70,213,196,.42)!important;box-shadow:0 8px 24px rgba(0,0,0,.22),0 0 20px rgba(70,213,196,.08);}
  .tapbtn.ui-hover-active .ui-hover-glow{opacity:1;}
  .ui-hover-glow{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .18s ease;background:radial-gradient(circle at var(--ui-mx,50%) var(--ui-my,50%),rgba(70,213,196,.18) 0%,rgba(70,213,196,.08) 22%,rgba(70,213,196,.025) 45%,transparent 70%);border-radius:inherit;}
  .tapbtn.ui-hover-active > :not(.ui-hover-glow){position:relative;z-index:1;}
  .tapbtn:disabled{cursor:not-allowed;}
  @media (hover:none){.tapbtn.ui-hover-active{transform:none;box-shadow:none;border-color:inherit!important;}.ui-hover-glow{display:none;}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;}
  .barTrack{height:7px;background:#101315;border-radius:999px;overflow:hidden;}
  .barFill{height:100%;}
  .fadein{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:14px;}

  .appFooter{margin-top:28px;padding:16px 10px 4px;text-align:center;border-top:1px solid rgba(70,213,196,.08);color:var(--dim2);font-size:10.5px;letter-spacing:.25px;line-height:1.7;}
  .appFooter .author{display:inline-block;color:var(--dim);font-weight:600;padding:5px 10px;border-radius:9px;transition:transform .22s cubic-bezier(.2,.75,.25,1),color .22s ease,background .22s ease,box-shadow .22s ease;}
  .appFooter .author:hover{color:var(--accent);background:rgba(70,213,196,.045);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.18),0 0 18px rgba(70,213,196,.05);}
  .appFooter .dot{color:var(--accent);opacity:.7;padding:0 4px;}
  .hdr .logo{font-size:20px;font-weight:700;letter-spacing:.5px;}
  .hdr .logo span{color:var(--accent);}
  .hdr .tag{font-size:10px;color:var(--dim);letter-spacing:.5px;}

  .grid6{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0;}
  @media(min-width:520px){.grid6{grid-template-columns:repeat(3,1fr);}}
  .modcard{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;position:relative;width:100%;display:block;box-sizing:border-box;}
  .modcard .badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:10px;}
  .modcard .name{font-size:13px;font-weight:600;margin-bottom:4px;}
  .modcard .score{font-size:20px;font-weight:700;}
  .modcard .cta{font-size:11px;color:var(--accent);margin-top:6px;}
  /* Hover spotlight: cyan glow follows the mouse and the card lifts slightly. */
  .modcard{
    --mx:50%; --my:50%;
    overflow:hidden;
    transform:translate3d(0,0,0);
    transition:transform .22s cubic-bezier(.2,.75,.25,1), box-shadow .22s ease, border-color .22s ease;
    will-change:transform;
  }
  .modcard::before{
    content:"";
    position:absolute;
    inset:-35%;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at var(--mx) var(--my),
      rgba(70,213,196,.18) 0%,
      rgba(70,213,196,.08) 20%,
      rgba(70,213,196,.025) 42%,
      transparent 68%);
    transition:opacity .2s ease;
  }
  .modcard:hover{
    transform:translate3d(0,-4px,0) scale(1.012);
    border-color:rgba(70,213,196,.38);
    box-shadow:0 10px 28px rgba(0,0,0,.28), 0 0 22px rgba(70,213,196,.06);
  }
  .modcard:hover::before{opacity:1;}
  .modcard > *{position:relative;z-index:1;}
  @media (hover:none){
    .modcard:hover{transform:none;box-shadow:none;border-color:var(--border);}
    .modcard:hover::before{opacity:0;}
  }
  .delbtn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--dim2);font-size:13px;padding:2px 6px;}

  .captureBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .iconBtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .iconBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(70,213,196,0.1);}

  .viewfinder{position:relative;background:#0D1012;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;}
  .viewfinder.flash{background:#1c1f22;}
  .viewfinder img{width:100%;height:100%;object-fit:cover;opacity:0.92;}
  .corner{position:absolute;width:20px;height:20px;border-color:var(--dim2);z-index:3;opacity:0.6;}
  .c-tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;}
  .c-tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;}
  .c-bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;}
  .c-br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;}

  .cornerRef{position:absolute;bottom:10px;right:10px;width:58px;height:58px;background:rgba(10,12,14,0.5);border-radius:10px;z-index:4;padding:4px;}
  .centerGhost{position:absolute;top:8%;bottom:8%;left:0;right:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}

  .shutterWrap{display:flex;flex-direction:column;align-items:center;margin:14px 0 10px;}
  .shutterBtn{width:64px;height:64px;border-radius:999px;border:4px solid var(--accent);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .shutterBtn::after{content:"";width:48px;height:48px;border-radius:999px;background:var(--accent);}
  .shutterBtn.done::after{background:var(--good);}
  .shutterBtn.reject::after{background:var(--bad);}
  .cameraTimerBtn{
    border:1px solid rgba(255,255,255,.22);
    background:rgba(10,12,14,.58);
    color:#fff;
    padding:7px 11px;
    border-radius:999px;
    font-size:11px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .cameraTimerBtn:hover{transform:translateY(-1px);border-color:rgba(70,213,196,.65);}
  .cameraTimerBtn.active{background:rgba(70,213,196,.18);border-color:#46D5C4;color:#46D5C4;font-weight:700;}

  .stars{font-size:15px;letter-spacing:2px;}
  .noteText{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;margin-top:4px;}
  .reasonBox{font-size:12px;color:var(--bad);text-align:center;margin-top:6px;}
  .cautionBox{font-size:11.5px;color:var(--mid);text-align:center;margin-top:6px;}

  .scanOverlay{position:absolute;inset:0;pointer-events:none;}
  .scanline{position:absolute;left:0;right:0;height:34px;background:linear-gradient(180deg,rgba(70,213,196,0) 0%,rgba(70,213,196,0.28) 50%,rgba(70,213,196,0) 100%);animation:sweep 1.6s linear infinite;}
  @keyframes sweep{0%{top:-15%;}100%{top:105%;}}
  .grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(70,213,196,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(70,213,196,0.07) 1px,transparent 1px);background-size:24px 24px;}

  .confetti{position:fixed;top:-20px;width:8px;height:14px;opacity:0.9;z-index:999;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0.3;}}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;z-index:998;opacity:0;transition:opacity .3s ease;pointer-events:none;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;}

  input[type=file]{display:none;}
  input[type=number],input[type=text]{width:100%;background:#15181B;border:1px solid #2A3034;border-radius:10px;padding:10px 12px;color:var(--text);font-size:15px;outline:none;}

  .toggleRow{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
  .switch{width:38px;height:22px;border-radius:999px;background:#2A3034;position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .15s ease;}
  .switch.on::after{left:18px;}

  .stageRow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;color:var(--dim2);}
  .stageRow.active{color:var(--accent);}
  .stageRow.done{color:var(--good);}
  .stageDot{width:16px;height:16px;border-radius:999px;border:2px solid currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}

  .procOverlay{position:absolute;inset:0;z-index:5;background:rgba(10,12,14,0.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .procSpinner{width:30px;height:30px;border-radius:999px;border:3px solid #2A3034;border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .procLabel{font-size:11.5px;color:var(--dim);text-align:center;padding:0 20px;}

  .chipRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11px;line-height:1.4;text-align:left;}
  .chip.chipInfo{background:rgba(70,213,196,0.12);color:var(--accent);border:1px solid rgba(70,213,196,0.3);}
  .chip.chipWarn{background:rgba(232,184,74,0.12);color:var(--mid);border:1px solid rgba(232,184,74,0.3);}

  /* UI V2 — futuristic AI dashboard */
  body{overflow-x:hidden;background:
    radial-gradient(700px 420px at 8% -10%,rgba(70,213,196,.08),transparent 62%),
    radial-gradient(620px 360px at 100% 18%,rgba(140,111,232,.07),transparent 62%),
    var(--bg);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 78%);}
  .ambient-orb{position:fixed;width:280px;height:280px;border-radius:50%;pointer-events:none;filter:blur(70px);opacity:.08;z-index:-1;background:var(--accent);animation:orbFloat 12s ease-in-out infinite alternate;}
  .ambient-orb.one{left:-160px;top:24vh}.ambient-orb.two{right:-170px;top:64vh;background:var(--accent2);animation-delay:-5s}
  @keyframes orbFloat{from{transform:translate3d(0,-15px,0)}to{transform:translate3d(30px,35px,0)}}
  .hdr{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(20,23,26,.72),rgba(20,23,26,.25));border:1px solid rgba(70,213,196,.08);border-radius:16px;padding:15px 16px;margin-bottom:18px;box-shadow:0 10px 40px rgba(0,0,0,.16);}
  .hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.22;}
  .statusBadge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid rgba(70,213,196,.22);border-radius:999px;background:rgba(70,213,196,.07);color:var(--accent);font-size:9px;letter-spacing:.5px;}
  .statusDot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(70,213,196,.9);animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{50%{opacity:.45;transform:scale(.75)}}
  .heroCard{position:relative;overflow:hidden;border-color:rgba(70,213,196,.16);background:linear-gradient(135deg,rgba(20,23,26,.96),rgba(17,24,25,.92));box-shadow:0 16px 48px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025);}
  .heroCard::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 18% 20%,rgba(70,213,196,.13),transparent 34%),radial-gradient(circle at 82% 75%,rgba(140,111,232,.08),transparent 36%);pointer-events:none;}
  .heroCard>*{position:relative;z-index:1}
  .aiStatus{display:inline-flex;align-items:center;gap:7px;font-size:10px;color:var(--accent);border:1px solid rgba(70,213,196,.2);background:rgba(70,213,196,.06);padding:5px 9px;border-radius:999px;}
  .scoreHalo{filter:drop-shadow(0 0 12px rgba(70,213,196,.08));}
  .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .sectionTitle .eyebrow{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.7px;color:var(--dim2);}
  .sectionTitle h3{margin:2px 0 0;font-family:'Space Grotesk',sans-serif;font-size:15px;}
  .radarCard{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(20,23,26,.96),rgba(16,20,22,.94));}
  .radarWrap{display:grid;grid-template-columns:minmax(230px,1fr) minmax(150px,.75fr);align-items:center;gap:10px;}
  .radarLegend{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .radarLegendItem{padding:8px 9px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.018);transition:transform .18s ease,border-color .18s ease,background .18s ease;}
  .radarLegendItem:hover{transform:translateY(-2px);border-color:rgba(70,213,196,.28);background:rgba(70,213,196,.045);}
  .radarLegendItem .rlabel{font-size:10px;color:var(--dim);}.radarLegendItem .rscore{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:2px;}
  .metricBars{display:grid;gap:10px;}
  .metricRow{display:grid;grid-template-columns:58px 1fr 35px;gap:8px;align-items:center;font-size:10.5px;}
  .metricRow .metricName{color:var(--dim)}.metricRow .metricValue{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;}
  .metricTrack{height:6px;background:#0d1012;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.025)}
  .metricFill{height:100%;border-radius:999px;background:linear-gradient(90deg,rgba(70,213,196,.35),var(--accent));box-shadow:0 0 10px rgba(70,213,196,.12)}
  .profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .profileStat{padding:10px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.015)}
  .profileStat .k{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim2)}.profileStat .v{font-size:13px;font-weight:700;margin-top:4px}
  .profileStat .s{font-size:9px;color:var(--dim);margin-top:2px}
  .modSection{margin-top:16px;}
  .modcard{cursor:pointer;}
  .modcard::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(70,213,196,0);transition:border-color .22s ease;pointer-events:none;}
  .modcard:hover::after{border-color:rgba(70,213,196,.14)}
  .analysisPulse{animation:analysisPulse 1.6s ease-in-out infinite}.analysisPulseBar{animation:barPulse 1.5s ease-in-out infinite}
  @keyframes analysisPulse{50%{opacity:.72;transform:scale(.98)}} @keyframes barPulse{50%{opacity:.5}}
  .cameraShell{position:fixed;inset:0;background:#050708;z-index:2000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .cameraChrome{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.62),transparent 24%,transparent 72%,rgba(0,0,0,.72));}
  .cameraTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;z-index:3}
  .cameraRoundBtn{width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(10,12,14,.48);backdrop-filter:blur(12px);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.18)}
  .cameraInfo{position:absolute;top:70px;left:20px;right:20px;text-align:center;color:#fff;font-size:11px;z-index:3;letter-spacing:.2px}
  .cameraGuide{position:absolute;inset:12% 12%;border:1px solid rgba(70,213,196,.34);border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.08),inset 0 0 34px rgba(70,213,196,.035);pointer-events:none;z-index:2}
  .cameraGuide::before,.cameraGuide::after{content:"";position:absolute;width:28px;height:28px;border-color:var(--accent);opacity:.72}
  .cameraGuide::before{left:-1px;top:-1px;border-left:2px solid;border-top:2px solid;border-radius:10px 0 0 0}.cameraGuide::after{right:-1px;bottom:-1px;border-right:2px solid;border-bottom:2px solid;border-radius:0 0 10px 0}
  .cameraBottom{position:absolute;bottom:0;left:0;right:0;padding:12px 18px 22px;z-index:3;text-align:center}
  .cameraTimerRow{display:flex;justify-content:center;gap:7px;margin-bottom:15px}.cameraTimerBtn{backdrop-filter:blur(12px);}
  .cameraCaptureRow{display:flex;align-items:center;justify-content:center;gap:20px}.cameraShutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;box-shadow:0 0 0 1px rgba(70,213,196,.4),0 0 28px rgba(70,213,196,.16);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.cameraShutter:hover{transform:scale(1.04);box-shadow:0 0 0 1px rgba(70,213,196,.7),0 0 34px rgba(70,213,196,.24)}.cameraShutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:background .15s ease}.cameraShutter:hover > span:not(.ui-hover-glow){background:var(--accent)}
  .cameraCountdownBig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:110px;font-weight:700;text-shadow:0 4px 40px rgba(0,0,0,.7);pointer-events:none;z-index:4}
  .countdownPop{animation:countdownPop .75s ease both}@keyframes countdownPop{from{transform:scale(1.45);opacity:0}35%{opacity:1}to{transform:scale(1);opacity:.9}}
  @media(max-width:650px){.radarWrap{grid-template-columns:1fr}.radarLegend{grid-template-columns:repeat(3,1fr)}.profileGrid{grid-template-columns:1fr 1fr}.hdr .tag{display:none}}
  @media(max-width:430px){.radarLegend{grid-template-columns:1fr 1fr}.metricRow{grid-template-columns:52px 1fr 32px}}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ------------------------------------------------------------------ */
/* GHOST / REFERENCE ICON LIBRARY                                       */
/* ------------------------------------------------------------------ */
const POSE_LIMBS = { // used only in Advanced Mode (full silhouette)
  arms_front:   { arms:["M50 46 L22 62 L34 40","M50 46 L78 62 L66 40"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  arms_back:    { arms:["M50 46 L18 66 L30 86","M50 46 L82 66 L70 86"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  chest_hips:   { arms:["M50 46 L26 70 L40 92","M50 46 L74 70 L60 92"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  chest_squeeze:{ arms:["M50 46 L30 58 L50 68","M50 46 L70 58 L50 68"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  back_relaxed: { arms:["M50 46 L40 90","M50 46 L60 90"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  back_latspread:{ arms:["M50 46 L14 68 L34 90","M50 46 L86 68 L66 90"], legs:["M50 110 L32 190","M50 110 L68 190"] },
  shoulder_side:{ arms:["M50 46 L42 92","M50 46 L84 38 L98 30"], legs:["M50 110 L36 190","M50 110 L64 190"] },
  abs_crunch:   { torso:"M50 34 Q57 70 50 110", arms:["M53 42 L30 24","M53 42 L72 24"], legs:["M50 110 L34 188","M50 110 L66 188"] },
  legs_front:   { arms:["M50 46 L42 92","M50 46 L58 92"], legs:["M50 110 L30 190","M50 110 L70 190"] },

const ELITE_BENCHMARK = {
  label: "Chuẩn Elite (tổng hợp IFBB Pro)",
  ffmiMin: 23, ffmiElite: 25,
  bodyFatPct: "8-12%",

function estimateBodyMetrics(profile){
  // Ước tính %mỡ cơ thể và FFMI (Fat-Free Mass Index) từ chiều cao/cân nặng —
  // mô phỏng, chưa dựa trên đo đạc 3D thật.
  const heightM = profile.height/100;
  const seed = seedFrom("bf"+profile.height+profile.weight+profile.age);
  const estBodyFatPct = clamp(round1(10 + seed*14), 8, 32);
  const leanMass = profile.weight * (1 - estBodyFatPct/100);
  const ffmi = round1(leanMass/(heightM*heightM) + 6.1*(1.8-heightM));
  const somaSeed = seedFrom("soma"+profile.height+profile.weight);
  const somatotypes = ["Mesomorph-Ectomorph","Mesomorph cân đối","Ectomorph-Mesomorph","Endomorph-Mesomorph"];
  const somatotype = somatotypes[Math.floor(somaSeed*somatotypes.length)];
  let ffmiLabel;
  if(ffmi>=ELITE_BENCHMARK.ffmiElite) ffmiLabel="Elite";
  else if(ffmi>=ELITE_BENCHMARK.ffmiMin) ffmiLabel="Nâng cao";
  else if(ffmi>=19) ffmiLabel="Trung bình khá";
  else ffmiLabel="Mới bắt đầu";
  return { estBodyFatPct, ffmi, ffmiLabel, somatotype };
}

const PERSIST_DB = "AIPhysiqueAnalyzerDB";
const PERSIST_STORE = "appState";
const PERSIST_KEY = "currentUser";
let persistReady = false;
let persistTimer = null;
function serializableState(){
  return {profile:state.profile,modules:state.modules,advancedMode:!!state.advancedMode,savedAt:new Date().toISOString()};
}
function persistFallback(){
  try{localStorage.setItem("AI_PHYSIQUE_ANALYZER_STATE",JSON.stringify(serializableState()));}catch(err){console.warn("Không thể lưu dữ liệu cục bộ",err);}
}
function persistState(){
  clearTimeout(persistTimer);
  persistTimer=setTimeout(()=>{
    if(!persistReady || !window.indexedDB){persistFallback();return;}
    try{
      const req=indexedDB.open(PERSIST_DB,1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(PERSIST_STORE))req.result.createObjectStore(PERSIST_STORE);};
      req.onsuccess=()=>{const db=req.result;const tx=db.transaction(PERSIST_STORE,"readwrite");tx.objectStore(PERSIST_STORE).put(serializableState(),PERSIST_KEY);tx.oncomplete=()=>db.close();};
      req.onerror=()=>persistFallback();
    }catch(err){persistFallback();}
  },100);
}
function readFallback(){try{const raw=localStorage.getItem("AI_PHYSIQUE_ANALYZER_STATE");return raw?JSON.parse(raw):null;}catch{return null;}}
function applyPersistedData(data){
  if(data?.profile)state.profile=data.profile;
  if(data?.modules&&typeof data.modules==="object")state.modules=data.modules;
  if(typeof data?.advancedMode==="boolean")state.advancedMode=data.advancedMode;
  state.view=state.profile?"dashboard":"profile";state.activeModule=null;state.shots={};state.analyzing=false;state.analyzeStage=-1;
}
function loadPersistedState(){
  const fallback=readFallback();
  if(!window.indexedDB){applyPersistedData(fallback);render();return;}
  try{
    const req=indexedDB.open(PERSIST_DB,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(PERSIST_STORE))req.result.createObjectStore(PERSIST_STORE);};
    req.onsuccess=()=>{
      const db=req.result;const getReq=db.transaction(PERSIST_STORE,"readonly").objectStore(PERSIST_STORE).get(PERSIST_KEY);
      getReq.onsuccess=()=>{persistReady=true;applyPersistedData(getReq.result||fallback);db.close();render();};
      getReq.onerror=()=>{persistReady=true;applyPersistedData(fallback);db.close();render();};
    };

}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function seedFrom(s){return (hashStr(s)%1000)/1000;}
function round1(n){return Math.round(n*10)/10;}

function completedCount(){return MODULE_ORDER.filter(k=>state.modules[k]).length;}

/* Điểm tỷ lệ & cân đối (Symmetry & Proportion Score) — đánh giá sự hài hòa
   giữa các nhóm cơ (vai/eo, ngực/eo, vai/hông, chân/thân...), độc lập với
   khối lượng cơ tuyệt đối của từng phần. Một body cân đối, hài hòa vẫn đạt
   điểm cao dù không có nhóm cơ nào "khủng" nhất. */
function computeProportionScore(){
  if(!bodyUnlocked()) return null;
  const scores = MODULE_ORDER.map(k=>state.modules[k].score);
  const mean = scores.reduce((a,b)=>a+b,0)/scores.length;
  const variance = scores.reduce((a,b)=>a+(b-mean)*(b-mean),0)/scores.length;
  const stddev = Math.sqrt(variance);
  const harmonyPart = clamp(10 - stddev*2.2, 3, 10);        // càng đồng đều giữa các nhóm cơ, càng hài hòa
  const seed = seedFrom("proportion"+(state.profile?state.profile.height+state.profile.weight:0)+Math.round(mean*10));
  const baselinePart = 6.0 + seed*3.6;                       // tỷ lệ vàng vai/eo, ngực/eo... mô phỏng
  return round1(clamp(harmonyPart*0.45 + baselinePart*0.55, 1, 10));
}

function computeBodyScore(){
  if(!bodyUnlocked()) return null;
  let weightedSum=0;
  MODULE_ORDER.forEach(k=>{ weightedSum += state.modules[k].score * MODULES[k].weight; });
  const weightedAvg = weightedSum/100;
  const proportionScore = computeProportionScore();
  // Overall = 0.6 * trung bình trọng số nhóm cơ + 0.4 * Điểm tỷ lệ & cân đối
  return round1(clamp(weightedAvg*0.6 + proportionScore*0.4, 1, 10));
}
function getTimeRange(score){
  return TIME_TABLE.find(r=>score>=r.min && score<=r.max) || TIME_TABLE[TIME_TABLE.length-1];
}

/* Quy trình tiền xử lý thông minh 2 bước (theo tài liệu):
   1) Chuẩn hóa ánh sáng — ảnh thiếu sáng/bóng đổ được AI tự động "phục hồi"
      thay vì bị từ chối (mô phỏng PromptNorm / Frequency-Prior Enhanced).
   2) Đánh giá tư thế theo góc khớp (mô phỏng MediaPipe BlazePose) — nếu tư thế
      lệch, hệ thống đưa gợi ý điều chỉnh cụ thể thay vì từ chối ảnh.
   Chỉ từ chối (yêu cầu chụp lại) khi ảnh bị che khuất nghiêm trọng, hiếm gặp. */
function computeShotAnalysis(moduleKey, shotIdx, poseKey, attempts, advanced){
  const seedLight = seedFrom(moduleKey+shotIdx+"light"+attempts);
  const seedPose  = seedFrom(moduleKey+shotIdx+"pose"+attempts);
  const seedOcc   = seedFrom(moduleKey+shotIdx+"occ"+attempts);

  const rawLight = round1(3 + seedLight*6);           // ánh sáng gốc: 3–9
  const lightingNormalized = rawLight < 6.5;           // cần chuẩn hóa
  const finalLight = lightingNormalized ? clamp(round1(rawLight+3.2), 6.5, 9.3) : rawLight;

  const rawPose = round1(3 + seedPose*6.5);            // độ chuẩn góc khớp: 3–9.5
  const poseOff = rawPose < 6.3;
  const tipsArr = POSE_ADJUST_TIPS[poseKey] || [];
  const poseTip = poseOff && tipsArr.length ? tipsArr[hashStr(moduleKey+shotIdx+attempts)%tipsArr.length] : null;

  // Từ chối cực hiếm: chỉ khi ảnh bị che nghiêm trọng ở lần chụp đầu tiên
  const severeOcclusion = seedOcc < 0.08 && attempts===1;

  const attemptBonus = (attempts-1)*1.2;
  const advBonus = advanced ? 0.8 : 0;
  const poseComponent = poseOff ? rawPose : 9.3;
  const trust = clamp(round1((finalLight+poseComponent)/2 + attemptBonus + advBonus), 1, 10);

  const band = severeOcclusion ? "reject" : (trust<9 ? "caution" : "good");
  const reason = severeOcclusion ? REJECT_REASONS[hashStr(moduleKey+shotIdx+attempts)%REJECT_REASONS.length] : null;

  return { trust, band, reason, lightingNormalized: lightingNormalized && !severeOcclusion, poseTip: severeOcclusion ? null : poseTip };
}

function analyzeModule(moduleKey, shotsArr){
  const mod = MODULES[moduleKey];
  const photoDataUrls = shotsArr.map(s=>s.img);
  const avgTrust = shotsArr.reduce((a,s)=>a+s.trust,0)/shotsArr.length;
  const confidencePct = Math.round(avgTrust*10);
  const seedBase = seedFrom(moduleKey + photoDataUrls.length + Math.round(avgTrust*10));
  // Chấm theo PHÂN VỊ (percentile) trong quần thể tham chiếu (người tập gym cùng
  // giới tính/độ tuổi), thay vì thang tuyệt đối 0-10 kiểu "10 = lý tưởng tuyệt đối".
  // Điểm 7 nghĩa là "vượt trội hơn 70% người tập gym cùng hạng" — nhờ vậy một VĐV
  // đỉnh cao (percentile ~99%) sẽ đạt điểm 9-10 thay vì bị kẹt ở mức 6-7.
  const basePercentile = 50 + seedBase*45; // 50–95
  const subs = mod.subs.map(s=>{
    const variation = (seedFrom(s.k+moduleKey)-0.5)*18;
    const pct = clamp(Math.round(basePercentile+variation), 3, 99);
    const sc = round1(pct/10);
    return {l:s.l, score:sc, percentile:pct};
  });
  const score = round1(subs.reduce((a,b)=>a+b.score,0)/subs.length);
  const percentile = clamp(Math.round(score*10), 1, 99);
  let strongest=subs[0], weakest=subs[0];
  subs.forEach(s=>{ if(s.score>strongest.score) strongest=s; if(s.score<weakest.score) weakest=s; });
  const comment = strongest.l===weakest.l
    ? `${mod.label} phát triển khá đồng đều ở mức ${score.toFixed(1)} điểm.`
    : `${strongest.l} đạt ${strongest.score.toFixed(1)} điểm nhưng ${weakest.l} chỉ ${weakest.score.toFixed(1)} điểm → bạn nên tăng cường bài tập cho ${weakest.l}.`;
  return {score, subs, comment, photos:photoDataUrls, percentile, confidencePct};
}

function showToast(msg, ms=3600){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"), ms);
}
function fireConfetti(){
  const colors=["#46D5C4","#8C6FE8","#46D98F","#E8B84A","#ECEEEC"];
  for(let i=0;i<70;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.style.left=Math.random()*100+"vw";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration=(2+Math.random()*1.5)+"s";
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

/* Generic cursor-following glow for every clickable button in the app. */
function wireButtonHoverEffects(){
  document.querySelectorAll(".tapbtn").forEach(btn=>{
    if(btn.querySelector(":scope > .ui-hover-glow"))return;
    const glow=document.createElement("span");glow.className="ui-hover-glow";btn.insertBefore(glow,btn.firstChild);
    btn.addEventListener("pointerenter",()=>btn.classList.add("ui-hover-active"));
    btn.addEventListener("pointerleave",()=>btn.classList.remove("ui-hover-active"));
    btn.addEventListener("pointermove",e=>{const r=btn.getBoundingClientRect();btn.style.setProperty("--ui-mx",`${e.clientX-r.left}px`);btn.style.setProperty("--ui-my",`${e.clientY-r.top}px`);});
  });
}

function radarSvg(scores){
  const labels=["Vai","Ngực","Lưng","Tay","Bụng","Chân"];
  const vals=MODULE_ORDER.map(k=>scores[k]||0);
  const cx=130,cy=130,r=88;
  const pts=(scale)=>labels.map((_,i)=>{
    const a=(-Math.PI/2)+(i*Math.PI*2/6);
    const rr=r*scale;
    return `${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)}`;
  }).join(" ");
  const dataPts=vals.map((v,i)=>{const a=(-Math.PI/2)+(i*Math.PI*2/6),rr=r*(v/10);return `${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)}`;}).join(" ");
  const axes=labels.map((l,i)=>{const a=(-Math.PI/2)+(i*Math.PI*2/6);const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;const tx=cx+Math.cos(a)*(r+18),ty=cy+Math.sin(a)*(r+18)+3;return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.08)"/><text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" fill="#8A9299" font-size="9">${l}</text>`;}).join("");
  return `<svg viewBox="0 0 260 260" width="100%" height="250" aria-label="Biểu đồ phát triển cơ bắp">
    <polygon points="${pts(1)}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
    <polygon points="${pts(.75)}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <polygon points="${pts(.5)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    <polygon points="${pts(.25)}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
    ${axes}
    <polygon points="${dataPts}" fill="rgba(70,213,196,.12)" stroke="#46D5C4" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>{const a=(-Math.PI/2)+(i*Math.PI*2/6),rr=r*(v/10),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#0A0C0E" stroke="#46D5C4" stroke-width="2"/>`;}).join("")}
  </svg>`;
}

    const shot = state.shots[i];
    const hasImg = shot && shot.img;
    const processing = shot && shot.processing;
    const band = shot && !processing ? shot.band : null;
    const stars = (shot && !processing) ? "⭐".repeat(clamp(Math.round(shot.trust/2),1,5)) + "☆".repeat(5-clamp(Math.round(shot.trust/2),1,5)) : "";
    const chips = [];
    if(shot && !processing && shot.lightingNormalized) chips.push(`<span class="chip chipInfo">💡 Đã tự động chuẩn hóa ánh sáng</span>`);
    if(shot && !processing && shot.poseTip) chips.push(`<span class="chip chipWarn">📐 Gợi ý: ${shot.poseTip}</span>`);
    return `
      <div style="margin-bottom:18px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Ảnh ${i+1}: ${s.t}</div>
        <div class="viewfinder ${state.flashOn?'flash':''}" style="aspect-ratio:3/4;">
          ${hasImg ? `<img src="${shot.img}"/>` : ""}
          ${processing ? `
            <div class="procOverlay">
              <div class="procSpinner"></div>
              <div class="procLabel">Đang đánh giá tư thế &amp; chuẩn hóa ánh sáng...</div>
            </div>` : ""}
          <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
          ${state.advancedMode
            ? `<div class="centerGhost">${centerGhostSVG(s.pose)}</div>`
            : `<div class="cornerRef" style="opacity:0.55;">${cornerIcon(mod.icon)}</div>`}
        </div>
        <div class="shutterWrap">
          <button type="button" class="tapbtn shutterBtn ${band==='good'||band==='caution'?'done':(band==='reject'?'reject':'')}" onclick="openCamera(${i})" aria-label="Mở camera chụp ảnh"></button>
        </div>
        <div class="noteText" style="margin-top:0;margin-bottom:2px;">📷 Chụp trực tiếp trong app — ảnh không được lưu vào thư viện/kho ảnh máy.</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;">
          <button class="tapbtn" onclick="pickFromLibrary(${i})" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--dim);font-size:12px;">
            📁 Thư viện
          </button>
          <button class="tapbtn" onclick="pasteImage(${i})" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--dim);font-size:12px;">
            📋 Dán ảnh
          </button>
        </div>
        <div style="font-size:10.5px;color:var(--dim2);text-align:center;margin-top:6px;">Mẹo: bạn cũng có thể dán trực tiếp bằng Ctrl+V (Cmd+V trên Mac).</div>
        ${shot && !processing ? `<div style="text-align:center;"><span class="stars">${stars}</span> <span class="mono" style="font-size:11px;color:var(--dim);">Độ tin cậy ${Math.round(shot.trust*10)}%</span></div>` : ""}
        ${chips.length ? `<div class="chipRow">${chips.join("")}</div>` : ""}
        ${band==='caution' ? `<div class="cautionBox">Độ tin cậy ${Math.round(shot.trust*10)}% do ảnh chưa đủ độ tương phản/độ nét — vẫn được phân tích, nhưng chụp rõ hơn sẽ cho kết quả chính xác hơn.</div>` : ""}
        ${band==='reject' ? `<div class="reasonBox">⚠️ ${shot.reason} Vui lòng chụp lại.</div>` : ""}
      </div>`;
  }).join("");

  const allAccepted = mod.shots.every((_,i)=> state.shots[i] && !state.shots[i].processing && state.shots[i].band!=="reject");

  return `
    <div class="captureBar">
      <button class="tapbtn" onclick="backToDashboard()" style="background:none;border:none;color:var(--dim);font-size:13px;">✕ Thoát</button>
      <div class="sg" style="font-size:14px;font-weight:700;">${mod.label}</div>
      <button class="iconBtn tapbtn ${state.flashOn?'on':''}" onclick="toggleFlash()">🔦</button>
    </div>

    <div class="toggleRow">
      <div>
        <div style="font-size:13px;font-weight:600;">Chế độ nâng cao</div>
        <div style="font-size:11px;color:var(--dim);">Căn chính xác theo bóng ma toàn thân — cho điểm tín nhiệm cao hơn.</div>
      </div>
      <div class="switch ${state.advancedMode?'on':''}" onclick="toggleAdvanced()"></div>
    </div>

    <div class="noteText" style="margin-bottom:14px;text-align:left;">${mod.note}</div>

    ${shotsHtml}

    <button class="tapbtn" ${allAccepted && !state.analyzing ? "" : "disabled"} onclick="runAnalysis()"
      style="width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14px;margin-top:6px;
      background:${allAccepted && !state.analyzing ? "var(--accent)" : "#23282C"};
      color:${allAccepted && !state.analyzing ? "#0A0C0E" : "var(--dim2)"};">
      ${state.analyzing ? "Đang xử lý..." : "Phân tích ngay"}
    </button>
    ${state.analyzing ? renderPipeline() : ""}
  `;
}

function toggleFlash(){ state.flashOn=!state.flashOn; render(); }
function toggleAdvanced(){ state.advancedMode=!state.advancedMode; render(); }

function renderPipeline(){
  return `
    <div class="card" style="margin-top:14px;position:relative;overflow:hidden;">
      <div class="grid-overlay"></div><div class="scanline"></div>
      <div style="position:relative;">
        ${PIPELINE_STAGES.map((s,i)=>{
          const cls = i<state.analyzeStage ? "done" : (i===state.analyzeStage ? "active" : "");
          const dot = i<state.analyzeStage ? "✓" : (i+1);
          return `<div class="stageRow ${cls}"><span class="stageDot">${dot}</span><span>${s}</span></div>`;
        }).join("")}
      </div>
    </div>`;
}

      <div style="font-size:12.5px;color:#C7CCD1;line-height:1.6;">${MODULE_BENCHMARK_TEXT[k] ? MODULE_BENCHMARK_TEXT[k](benchmarkPctFor(k,data.score)) : ""}</div>

      <button class="tapbtn" onclick="toggleTips()" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12.5px;">Hướng dẫn cải thiện</button>

function toggleTips(){ state.showTips=!state.showTips; render(); }

/* HANDLERS                                                             */
/* ------------------------------------------------------------------ */
function openCapture(k){
  state.activeModule=k; state.shots={}; state.analyzing=false; state.analyzeStage=-1; state.showTips=false; state.view="capture"; render();
}
function openResult(k){
  state.activeModule=k; state.showTips=false; state.view="result"; render();
}
function backToDashboard(){
  state.view="dashboard"; state.activeModule=null; render();
}

/* ------------------------------------------------------------------ */
/* INPUT FILE DÙNG CHUNG — tạo 1 LẦN DUY NHẤT khi app khởi động, không */
/* tạo/xóa mỗi lần bấm nữa. Đây là cách khắc phục lỗi: chọn ảnh xong   */
/* không nạp được vào app, và bấm lần sau không mở lại được dialog.    */
/* ------------------------------------------------------------------ */
let libraryTargetIndex = null;
const libraryInput = document.createElement('input');
libraryInput.type = 'file';
libraryInput.accept = 'image/*';
libraryInput.style.display = 'none';
document.body.appendChild(libraryInput);
libraryInput.addEventListener('change', ()=>{
  const file = libraryInput.files && libraryInput.files[0];
  const idx = libraryTargetIndex;
  libraryInput.value = ''; // reset NGAY để lần bấm sau chắc chắn mở lại được
  if(file && idx!=null){
    const reader = new FileReader();
    reader.onload = e => processShotImage(idx, e.target.result);
    reader.readAsDataURL(file);
  }
});
function pickFromLibrary(i){
  libraryTargetIndex = i;
  libraryInput.value = ''; // đảm bảo dialog mở lại kể cả nếu lần trước bị hủy
  libraryInput.click();
}

let cameraNativeTargetIndex = null;
const cameraNativeInput = document.createElement('input');
cameraNativeInput.type = 'file';
cameraNativeInput.accept = 'image/*';
cameraNativeInput.capture = 'environment';
cameraNativeInput.style.display = 'none';
document.body.appendChild(cameraNativeInput);
cameraNativeInput.addEventListener('change', ()=>{
  const file = cameraNativeInput.files && cameraNativeInput.files[0];
  const idx = cameraNativeTargetIndex;
  cameraNativeInput.value = '';
  if(file && idx!=null){
    const reader = new FileReader();
    reader.onload = e => processShotImage(idx, e.target.result);
    reader.readAsDataURL(file);
  }
});
function pickFromCameraNative(i){
  cameraNativeTargetIndex = i;
  cameraNativeInput.value = '';
  cameraNativeInput.click();
}

/* ------------------------------------------------------------------ */
/* CAMERA TRỰC TIẾP TRONG APP (getUserMedia)                            */
/* Chụp ảnh ngay trong app bằng luồng video trực tiếp — ảnh chỉ tồn tại
   trong bộ nhớ (dataURL) để phân tích, KHÔNG được lưu vào thư viện/kho
   ảnh của máy như khi dùng camera hệ thống.                            */
/* ------------------------------------------------------------------ */
let cameraStream=null, cameraFacing='environment', cameraTargetIndex=null;

function openCamera(i){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    showToast("Trình duyệt này chưa hỗ trợ camera trực tiếp trong app — đang mở camera hệ thống...");
    pickFromCameraNative(i);
    return;
  }
  cameraTargetIndex=i; cameraFacing='environment';
  state.cameraTimer=0;
  buildCameraOverlay();
  startCameraStream();
}
function buildCameraOverlay(){
  if(document.getElementById('cameraOverlay')) return;
  const overlay=document.createElement('div');
  overlay.id='cameraOverlay';
  overlay.className='cameraShell';
  overlay.innerHTML=`
    <video id="cameraVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>
    <div class="cameraChrome"></div>
    <div class="cameraGuide"></div>
    <div class="cameraTop">
      <button type="button" class="cameraRoundBtn tapbtn" onclick="closeCamera()" aria-label="Đóng camera">✕</button>
      <button type="button" class="cameraRoundBtn tapbtn" onclick="flipCamera()" aria-label="Đổi camera">↻</button>
    </div>
    <div id="cameraStatus" class="cameraInfo"></div>
    <div id="cameraCountdown" class="cameraCountdownBig"></div>
    <div class="cameraBottom">
      <div class="cameraTimerRow">
        <button type="button" class="cameraTimerBtn tapbtn ${state.cameraTimer===0?'active':''}" onclick="setCameraTimer(0)">Không hẹn</button>
        <button type="button" class="cameraTimerBtn tapbtn ${state.cameraTimer===3?'active':''}" onclick="setCameraTimer(3)">3 giây</button>
        <button type="button" class="cameraTimerBtn tapbtn ${state.cameraTimer===5?'active':''}" onclick="setCameraTimer(5)">5 giây</button>
      </div>
      <div class="cameraCaptureRow">
        <div style="width:42px;"></div>
        <button type="button" class="cameraShutter tapbtn" onclick="capturePhoto()" aria-label="Chụp ảnh"><span></span></button>
        <div style="width:42px;color:#8A9299;font-size:10px;line-height:1.3;">Ảnh<br>tạm thời</div>
      </div>
      <div style="color:#8A9299;font-size:10px;margin-top:10px;">Căn người vào khung · ảnh chỉ dùng để phân tích</div>
    </div>
  `;
  document.body.appendChild(overlay);
  wireButtonHoverEffects();
}
async function startCameraStream(){
  const statusEl=document.getElementById('cameraStatus');
  try{
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
    cameraStream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:cameraFacing} }, audio:false });
    const video=document.getElementById('cameraVideo');
    if(video){ video.srcObject=cameraStream; }
    if(statusEl) statusEl.textContent="";
  } catch(err){
    if(statusEl) statusEl.textContent="Không thể mở camera — vui lòng cấp quyền truy cập camera, hoặc dùng Thư viện ảnh.";
    showToast("Không mở được camera. Hãy cấp quyền camera cho trang này, hoặc chọn ảnh từ thư viện.");
  }
}
function flipCamera(){
  cameraFacing = cameraFacing==='environment' ? 'user' : 'environment';
  startCameraStream();
}
let cameraCountdownTimer=null;

function setCameraTimer(seconds){
  state.cameraTimer=seconds;
  const countdown=document.getElementById('cameraCountdown');
  if(countdown) countdown.style.display='none';
  if(cameraCountdownTimer){ clearInterval(cameraCountdownTimer); cameraCountdownTimer=null; }
  buildCameraOverlay();
  const overlay=document.getElementById('cameraOverlay');
  if(overlay) overlay.querySelectorAll('.cameraTimerBtn').forEach(btn=>btn.classList.remove('active'));
  if(overlay){
    const btn=[...overlay.querySelectorAll('.cameraTimerBtn')].find(b=>b.textContent.trim()===(seconds===0?'Không hẹn':`${seconds} giây`));
    if(btn) btn.classList.add('active');
  }
}

function capturePhoto(){
  const video=document.getElementById('cameraVideo');
  if(!video || !video.videoWidth){ showToast("Camera chưa sẵn sàng, vui lòng thử lại sau giây lát."); return; }
  if(cameraCountdownTimer){ return; }
  if(state.cameraTimer>0){
    startCaptureCountdown(state.cameraTimer);
    return;
  }
  takePhotoNow();
}

function startCaptureCountdown(seconds){
  const countdown=document.getElementById('cameraCountdown');
  if(!countdown) return;
  let remaining=seconds;
  countdown.style.display='flex';
  countdown.textContent=remaining;
  showToast(`⏱️ Chụp sau ${remaining} giây`);
  cameraCountdownTimer=setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(cameraCountdownTimer);
      cameraCountdownTimer=null;
      countdown.textContent="";
      countdown.style.display='none';
      takePhotoNow();
      return;
    }
    countdown.textContent=remaining;
    countdown.classList.remove("countdownPop"); void countdown.offsetWidth; countdown.classList.add("countdownPop");
  },1000);
}

function takePhotoNow(){
  const video=document.getElementById('cameraVideo');
  if(!video || !video.videoWidth){ showToast("Camera chưa sẵn sàng, vui lòng thử lại sau giây lát."); return; }
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl=canvas.toDataURL('image/jpeg', 0.92);
  const idx=cameraTargetIndex;
  closeCamera();
  processShotImage(idx, dataUrl);
}

function closeCamera(){
  if(cameraCountdownTimer){ clearInterval(cameraCountdownTimer); cameraCountdownTimer=null; }
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  const overlay=document.getElementById('cameraOverlay');
  if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
  cameraTargetIndex=null;
}

/* Bước xử lý ảnh dùng chung cho cả 3 nguồn: chụp camera, chọn từ thư viện,
   và dán từ clipboard. */
function processShotImage(i, dataUrl){
  const prevAttempts = (state.shots[i] && state.shots[i].attempts) || 0;
  const attempts = prevAttempts+1;
  // Giai đoạn 1: hiển thị trạng thái đang tiền xử lý (đánh giá tư thế + chuẩn hóa ánh sáng)
  state.shots[i] = { img:dataUrl, attempts, processing:true };
  render();
  const moduleKey = state.activeModule;
  const poseKey = MODULES[moduleKey].shots[i].pose;
  setTimeout(()=>{
    // Giai đoạn 2: kết quả sau khi tiền xử lý xong
    const check = computeShotAnalysis(moduleKey, i, poseKey, attempts, state.advancedMode);
    state.shots[i] = {
      img:dataUrl, attempts, processing:false,
      trust:check.trust, band:check.band, reason:check.reason,
      lightingNormalized:check.lightingNormalized, poseTip:check.poseTip
    };
    render();
    if(check.band==="reject"){
      showToast(`Ảnh chưa đạt yêu cầu — ${check.reason}`);
    } else if(check.lightingNormalized){
      showToast("💡 Ảnh đã được tự động chuẩn hóa ánh sáng.");
    }
  }, 900);
}

/* Dán ảnh từ clipboard cho một ô ảnh cụ thể, dùng Clipboard API. */
async function pasteImage(i){
  try{
    if(navigator.clipboard && navigator.clipboard.read){
      const items = await navigator.clipboard.read();
      for(const item of items){
        const type = item.types.find(t=>t.startsWith('image/'));
        if(type){
          const blob = await item.getType(type);
          readBlobIntoShot(i, blob);
          return;
        }
      }
      showToast("Không tìm thấy ảnh trong clipboard.");
    } else {
      showToast("Trình duyệt này chưa hỗ trợ nút Dán — hãy bấm Ctrl+V (Cmd+V) khi đang xem khung ảnh.");
    }
  } catch(err){
    showToast("Không thể đọc clipboard — hãy thử Ctrl+V (Cmd+V), hoặc cấp quyền clipboard cho trang này.");
  }
}
function readBlobIntoShot(i, blob){
  const reader = new FileReader();
  reader.onload = e => processShotImage(i, e.target.result);
  reader.readAsDataURL(blob);
}

/* Cho phép dán ảnh bằng Ctrl+V/Cmd+V khi đang ở màn hình chụp, không cần
   bấm nút — tự tìm ô ảnh chưa có ảnh (hoặc bị từ chối) để điền vào. */
document.addEventListener('paste', (e)=>{
  if(state.view!=='capture' || !state.activeModule) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.indexOf('image/')===0){
      const blob = item.getAsFile();
      if(!blob) continue;
      const mod = MODULES[state.activeModule];
      let idx = mod.shots.findIndex((_,i)=> !state.shots[i] || state.shots[i].band==='reject');
      if(idx===-1) idx=0;
      readBlobIntoShot(idx, blob);
      e.preventDefault();
      break;
    }
  }
});

async function runAnalysis(){
  const k=state.activeModule; const mod=MODULES[k];
  const shotsArr = mod.shots.map((_,i)=>state.shots[i]).filter(Boolean);
  if(!shotsArr.length){ showToast("Vui lòng chụp đủ ảnh trước khi phân tích."); return; }

  state.analyzing=true; state.analyzeStage=0; render();

  try{
    // Gửi ảnh trực tiếp tới backend của chính app. API key chỉ nằm trên server.
    const payload = {
      moduleKey: k,
      moduleLabel: mod.label,
      criteria: mod.criteria,
      subMuscles: mod.subs.map(s=>({key:s.k,label:s.l})),
      shots: shotsArr.map(s=>({img:s.img, pose:s.pose || "unknown"}))
    };

    // Chỉ dùng animation như tiến trình hiển thị; kết quả thật đến từ Gemini backend.
    let stage=0;
    const stepTimer=setInterval(()=>{
      stage=Math.min(stage+1, PIPELINE_STAGES.length-1);
      state.analyzeStage=stage;
      render();
    },650);

    const response=await fetch("/api/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const body=await response.json().catch(()=>({error:"Server trả về dữ liệu không hợp lệ."}));
    clearInterval(stepTimer);

    if(!response.ok || !body.result){
      throw new Error(body.error || `AI server error (${response.status})`);
    }

    const ai=body.result;
    const subMap=new Map((ai.subs||[]).map(x=>[x.key,x]));
    const subs=mod.subs.map(s=>{
      const x=subMap.get(s.k) || {};
      const score=clamp(Number(x.score)||1,1,10);
      return {
        k:s.k,
        l:s.l,
        score,
        confidence:clamp(Math.round(Number(x.confidence)||0),0,100),
        evidence:x.evidence || "Không có mô tả bổ sung."
      };
    });

    const result={
      score:clamp(Number(ai.score)||1,1,10),
      subs,
      comment:ai.comment || "AI đã hoàn tất phân tích hình ảnh.",
      photos:shotsArr.map(s=>s.img),
      confidencePct:clamp(Math.round(Number(ai.confidence)||0),0,100),
      quality:ai.quality || null,
      measurements:ai.measurements || null,
      limitations:Array.isArray(ai.limitations)?ai.limitations:[]
    };

    finishAnalysis(k, shotsArr, result);
  }catch(err){
    state.analyzing=false; state.analyzeStage=-1; render();
    showToast("Không thể phân tích AI: " + (err.message || "Lỗi không xác định"));
    console.error(err);
  }
}
function finishAnalysis(k, shotsArr, aiResult){
  const wasUnlockedBefore = bodyUnlocked();
  const isUpdate = !!state.modules[k];
  const prevBodyScore = computeBodyScore();
  const result = aiResult;
  state.modules[k] = result;
  state.analyzing=false; state.analyzeStage=-1;
  state.view="result";
  render();

  const nowUnlocked = bodyUnlocked();
  if(nowUnlocked && !wasUnlockedBefore){
    setTimeout(()=>{ fireConfetti(); showToast("🎉 Chúc mừng! Bạn đã có đánh giá Body toàn diện."); }, 300);
  } else if(isUpdate && wasUnlockedBefore){
    const newScore = computeBodyScore();
    showToast(`Điểm Body vừa được cập nhật: ${prevBodyScore.toFixed(1)} ➔ ${newScore.toFixed(1)}`);
  }
}
function retake(k){
  state.shots={}; state.analyzing=false; state.analyzeStage=-1; state.view="capture"; render();
}
function deleteModule(k){
  if(!confirm(`Xóa dữ liệu module ${MODULES[k].label}?`)) return;
  const wasUnlocked = bodyUnlocked();
  delete state.modules[k];
  render();
  if(wasUnlocked) showToast("🔒 Điểm Body đã bị khóa lại do thiếu dữ liệu module.");
}

/* init — restore saved user data before first screen */
loadPersistedState();
</script>
